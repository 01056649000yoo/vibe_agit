name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/integration/**'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Show deployed commit
        run: git rev-parse --short HEAD

      # 새 DB 계약이 필요한 화면이 먼저 배포되지 않도록 롤백 검증과 적용을 앱 빌드 앞에서 끝낸다.
      - name: Validate and apply pending migrations
        run: |
          npm run migrate:check
          npm run migrate

      # 공간이 없는 채로 빌드하면 도커 데몬이 물려 앱이 내려간 채 복구가 안 된다(2026-08-18).
      # 옛 컨테이너를 지운 뒤 새 것을 못 띄우는 사이가 가장 위험하므로 그 앞에서 막는다.
      - name: Preflight disk check
        run: bash scripts/preflight-disk.sh 10

      # 칭호 기준은 화면(상수)과 DB(학기 마감 스냅샷) 두 곳이 같아야 한다.
      # 어긋나면 지난 학기 작별 편지의 칭호가 화면과 달라지는데 눈으로는 잡기 어렵다.
      - name: Check title level thresholds
        run: npm run check:title-levels

      - name: Build agit-app image (Supabase·Google public client config)
        run: |
          # 만드는 방법은 scripts/build-agit-app.sh 한 곳에만 둔다 — 로컬 배포도 같은 것을 부른다.
          # 되돌릴 지점도 그 안에서 빌드 앞에 남긴다.
          bash scripts/build-agit-app.sh

      - name: Restart container
        run: |
          # 띄우는 방법은 scripts/run-agit-app.sh 한 곳에만 둔다 — 로컬 배포도 같은 것을 부른다.
          bash scripts/run-agit-app.sh

      - name: Sync shared edge files
        run: |
          # 함수들이 함께 쓰는 파일을 먼저 올린다(AI 모델 이름 등). 로컬 배포도 같은 것을 부른다.
          bash scripts/sync-edge-shared.sh

      # 모든 Edge 함수를 폴더째 맞추고 함수마다 응답을 확인한다. 로컬 배포도 같은 스크립트를 부른다(2026-09-25).
      # 파일이 여럿인 함수(spelling-weekly-review 의 index.ts·reviewCore.js, book-search 등)도 함께 올라간다.
      - name: Sync edge functions
        run: bash scripts/sync-edge-functions.sh

      - name: Sync class exhibition public reader
        run: bash scripts/sync-class-agit-public-read.sh

      - name: Verify
        run: |
          sleep 4
          docker ps --filter name=agit-app --format "{{.Status}}"
          docker ps --filter name=agit-edge-functions --format "{{.Status}}"
          edge_status=$(docker inspect -f '{{.State.Status}}' agit-edge-functions)
          echo "edge status: $edge_status"
          [ "$edge_status" = "running" ] || exit 1
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8300/ --max-time 10)
          echo "app HTTP: $code"
          [ "$code" = "200" ] || exit 1
          edge_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:8100/functions/v1/vibe-ai \
            -H 'Content-Type: application/json' -d '{}' --max-time 10)
          echo "edge HTTP: $edge_code"
          [ "$edge_code" = "400" ] || exit 1
          neis_edge_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:8100/functions/v1/neis-meal \
            -H 'Content-Type: application/json' -d '{}' --max-time 10)
          echo "NEIS edge HTTP: $neis_edge_code"
          [ "$neis_edge_code" = "401" ] || exit 1

      # 도커 VM 디스크는 31.3GB뿐이라 누적된 빌드 캐시가 채우면 Kong 건강검진과 Storage 업로드가 함께 죽는다.
      # 전부 비우면 다음 배포가 콜드 빌드가 되므로 상한만 두고 오래된 캐시부터 버린다.
      # 배포 실패로 디스크가 찬 경우에도 다음 시도가 살아나도록 always로 돌리고, 정리 실패가 배포를 붉게 만들지 않게 한다.
      - name: Trim docker build cache
        if: always()
        continue-on-error: true
        run: |
          docker system df
          docker builder prune -f --max-used-space 6GB
          docker system df
