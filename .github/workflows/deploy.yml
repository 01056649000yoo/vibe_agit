name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/integration/**'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Show deployed commit
        run: git rev-parse --short HEAD

      - name: Build agit-app image (Supabase·Google public client config)
        run: |
          ANON=$(grep '^ANON_KEY=' "$HOME/agit-supabase/.env" | cut -d= -f2)
          GOOGLE_CLIENT_ID=$(grep -m1 '^GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=' "$HOME/agit-supabase/secrets.agit.env" | cut -d= -f2-)
          test -n "$ANON" || { echo "anon key not found"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "Google client ID not found"; exit 1; }
          docker build \
            --build-arg VITE_SUPABASE_URL=https://api.xn--vz0ba242ncqcba79xhwx.site \
            --build-arg VITE_SUPABASE_ANON_KEY="$ANON" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            -t agit-app:prod .

      - name: Restart container
        run: |
          docker rm -f agit-app 2>/dev/null || true
          docker run -d --name agit-app --restart unless-stopped -p 127.0.0.1:8300:80 agit-app:prod

      - name: Sync AI edge function
        run: |
          target="$HOME/agit-supabase/volumes/functions/vibe-ai/index.ts"
          if cmp -s supabase/functions/vibe-ai/index.ts "$target"; then
            echo "vibe-ai already current"
            exit 0
          fi
          install -m 0644 supabase/functions/vibe-ai/index.ts "$target"
          cd "$HOME/agit-supabase"
          docker compose up -d --no-deps --force-recreate functions

      - name: Verify
        run: |
          sleep 4
          docker ps --filter name=agit-app --format "{{.Status}}"
          docker ps --filter name=agit-edge-functions --format "{{.Status}}"
          edge_status=$(docker inspect -f '{{.State.Status}}' agit-edge-functions)
          echo "edge status: $edge_status"
          [ "$edge_status" = "running" ] || exit 1
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8300/ --max-time 10)
          echo "app HTTP: $code"
          [ "$code" = "200" ] || exit 1
          edge_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:8100/functions/v1/vibe-ai \
            -H 'Content-Type: application/json' -d '{}' --max-time 10)
          echo "edge HTTP: $edge_code"
          [ "$edge_code" = "400" ] || exit 1
