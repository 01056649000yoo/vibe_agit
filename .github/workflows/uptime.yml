name: Uptime check

# 맥미니 밖에서 확인하므로 정전·인터넷 단절·기계 고장도 감지한다.
# 실패하면 GitHub 저장소 알림 설정에 따라 관리자에게 워크플로 실패 알림이 간다.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check 끄적끄적아지트.site
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              "https://xn--vz0ba242ncqcba79xhwx.site/" || echo "000")
            if [ "$code" = "200" ]; then
              echo "OK (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed with status $code — retrying"
            sleep 20
          done
          echo "끄적끄적아지트.site 응답 없음 (마지막 상태: $code)"
          exit 1
