<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>끄적끄적 아지트 — 점검 중</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f1f5f9; color: #1e293b; font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      padding: 24px; box-sizing: border-box; }
    main { width: min(440px, 100%); background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
      padding: 40px 32px; text-align: center; box-shadow: 0 8px 24px rgba(15, 23, 42, .06); }
    .icon { font-size: 2.6rem; }
    h1 { margin: 12px 0; font-size: 1.4rem; }
    p { margin: 0 0 8px; color: #475569; line-height: 1.7; font-size: .95rem; word-break: keep-all; }
    .small { margin-top: 20px; color: #64748b; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🔧</div>
    <h1>잠시 점검 중이에요</h1>
    <p>문제를 고치고 있습니다. 조금 뒤에 다시 들어와 주세요.</p>
    <p>이미 저장된 글은 그대로 보관되어 있습니다.</p>
    <p class="small">계속 안 되면 관리 선생님께 알려 주세요.</p>
  </main>
</body>
</html>
